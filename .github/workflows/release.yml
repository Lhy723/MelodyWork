name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            worker_ext: ""
            beta_bundle_args: ""
            tauri_args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            worker_ext: ""
            beta_bundle_args: ""
            tauri_args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            worker_ext: ".exe"
            beta_bundle_args: "--bundles nsis"
            tauri_args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Load release notes
        id: release-notes
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME#v}.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "::error::Missing release notes: $notes_file"
            exit 1
          fi
          {
            echo 'body<<RELEASE_NOTES'
            cat "$notes_file"
            echo 'RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Verify release tag and source branch
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$package_version"

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_branch="beta"
          else
            release_branch="main"
          fi

          git fetch --no-tags origin "+refs/heads/$release_branch:refs/remotes/origin/$release_branch"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          git merge-base --is-ancestor "$release_commit" "origin/$release_branch"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: pnpm check:updater-key

      - name: Build and smoke-test Pi worker
        shell: bash
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          pnpm prepare:agent-worker
          MELODY_PI_WORKER_PATH="src-tauri/binaries/melody-agent-worker-${{ matrix.target }}${{ matrix.worker_ext }}" pnpm test:pi-worker-smoke

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MELODYWORK_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          MELODYWORK_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          MELODYWORK_BETA_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/download/update-beta/latest.json
        with:
          tagName: v__VERSION__
          releaseName: "MelodyWork v__VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: "${{ matrix.tauri_args }} ${{ contains(github.ref_name, '-') && matrix.beta_bundle_args || '' }} --config src-tauri/tauri.release.conf.json"

  publish-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Publish signed updater release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi

      - name: Update beta channel manifest
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest_path="$RUNNER_TEMP/latest.json"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir "$RUNNER_TEMP"
          if ! gh release view update-beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create update-beta --repo "$GITHUB_REPOSITORY" --title "MelodyWork 测试版更新通道" --notes "供客户端测试版渠道使用的签名更新清单。" --prerelease
          fi
          gh release upload update-beta "$manifest_path" --repo "$GITHUB_REPOSITORY" --clobber
