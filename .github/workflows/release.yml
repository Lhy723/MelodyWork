name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            sidecar_ext: ""
            tauri_args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            sidecar_ext: ""
            tauri_args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: ".exe"
            tauri_args: "--target x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            vendor/melody-build

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate updater public key
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: pnpm check:updater-key

      - name: Install Melody build tools
        run: cargo install dotslash --locked

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $protocZip = "protoc-29.3-win64.zip"
          $protocUrl = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/$protocZip"
          Invoke-WebRequest -Uri $protocUrl -OutFile $protocZip
          Expand-Archive -Path $protocZip -DestinationPath "$env:RUNNER_TEMP\protoc" -Force
          $protocDir = "$env:RUNNER_TEMP\protoc".Replace('\', '/')
          echo "$protocDir/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "PROTOC=$protocDir/bin/protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Melody sidecar
        shell: bash
        working-directory: vendor/melody-build
        run: |
          cargo build --locked --release --package melody-pager-bin --bin melody-pager
          mkdir -p ../../src-tauri/binaries
          cp "target/release/melody-pager${{ matrix.sidecar_ext }}" "../../src-tauri/binaries/melody-pager-${{ matrix.target }}${{ matrix.sidecar_ext }}"

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MELODYWORK_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          MELODYWORK_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        with:
          tagName: v__VERSION__
          releaseName: "MelodyWork v__VERSION__"
          releaseBody: "Download the installer for your platform. This is a beta release."
          releaseDraft: true
          prerelease: false
          args: "${{ matrix.tauri_args }} --config src-tauri/tauri.release.conf.json"
