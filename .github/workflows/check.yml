name: Check

on:
  pull_request:
  push:
    branches:
      - main
      - beta

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `xcap` (screen capture) pulls in pipewire and gbm on Linux:
      # - `libspa-sys`'s build script probes the pkg-config module `libpipewire-0.3`,
      #   which only `libpipewire-0.3-dev` ships (it pulls `libspa-0.2-dev` along).
      # - `gbm-sys` declares `#[link(name = "gbm")]`, so the linker needs the
      #   unversioned `libgbm.so` that only `libgbm-dev` ships (`libgbm1` has only
      #   the versioned `libgbm.so.1`).
      # The runtime packages arrive transitively; the -dev ones do not.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libgbm-dev
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `prepare-agent-worker.mjs` compiles the Pi worker with Bun 1.3+.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:ui-font
      - run: pnpm check:architecture
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:unit
      - run: pnpm test:agent-worker
      - run: pnpm test:smoke
      # `tauri_build::build()` rejects any `bundle.externalBin` entry that is
      # missing, so the sidecar must exist before any cargo command that builds
      # the crate. `.gitignore` excludes it, so CI has to compile it here.
      # `pnpm build` is `tsc && vite build` and does not need it.
      - run: pnpm prepare:agent-worker
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
