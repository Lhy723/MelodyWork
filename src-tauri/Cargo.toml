[package]
name = "melody-work"
version = "0.3.3-beta.4"
description = "A conversation-first desktop client for Melody Build"
authors = ["Lhy723"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "melody_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.22"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
chrono = "0.4.45"
sha2 = "0.10"
base64 = "0.22"
ignore = "=0.4.24"
glob = "0.3.4"
tree-sitter = "0.25.10"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
xcap = { version = "0.9.8", default-features = false }
