  "create_terminal_session",
  "write_terminal_input",
  "resize_terminal_session",
  "close_terminal_session",
  "read_melody_config",
  "read_melody_runtime_environment",
  "list_melody_agent_definitions",
  "list_melody_lsp_servers",
  "list_melody_mcp_servers",
  "list_melody_hooks",
  "list_melody_plugin_capabilities",
  "rebuild_melody_memory_index",
