[[permission]]
identifier = "allow-melody-commands"
description = "Explicitly expose only the commands used by the MelodyWork main window. High-impact commands still require Rust-side path and protocol checks; user-facing confirmations are handled in the app UI."
commands.allow = [
  "agent_status",
  "start_agent",
  "send_acp",
  "stop_agent",
  "git_changes",
  "git_diff",
  "git_branches",
  "git_stage",
  "git_unstage",
  "git_commit",
  "git_checkout_branch",
  "git_create_branch",
  "git_worktrees",
  "git_create_worktree",
  "git_remove_worktree",
  "list_projects",
  "upsert_project",
  "archive_project",
  "restore_project",
  "delete_project",
  "list_sessions",
  "read_session_timeline",
  "pi_worker_status",
  "start_pi_worker",
  "send_pi_agent_command",
  "stop_pi_worker",
  "get_agent_session_binding",
  "upsert_agent_session_binding",
  "delete_agent_session_binding",
  "read_agent_event_log",
  "inspect_pi_session_recovery",
  "begin_pi_migration",
  "list_pi_migration_journal",
  "fail_pi_migration",
  "get_pi_session_fork",
  "list_pi_session_forks",
  "read_pi_session_fork_reference",
  "prepare_pi_session_fork",
  "create_session",
  "update_session",
  "delete_session",
  "get_usage_statistics",
  "get_environment_capabilities",
  "get_file_opener_availability",
  "read_workspace_sandbox_plan",
  "set_menu_bar_visibility",
  "set_system_sleep_prevention",
  "workspace_tree",
  "pick_workspace_directory",
  "read_workspace_binary_file",
