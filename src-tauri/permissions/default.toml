  "list_agent_monitors",
  "start_agent_monitor",
  "cancel_agent_monitor",
  "list_agent_schedules",
  "create_agent_schedule",
  "set_agent_schedule_status",
  "list_agent_schedule_runs",
  "delete_agent_schedule",
  "pi_browser_open",
