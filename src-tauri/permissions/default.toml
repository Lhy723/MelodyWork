[[permission]]
identifier = "allow-melody-commands"
description = "Explicitly expose only the commands used by the MelodyWork main window. High-impact commands still require Rust-side path checks and native confirmation."
commands.allow = [
  "agent_status",
  "start_agent",
  "send_acp",
  "stop_agent",
  "git_changes",
  "git_diff",
  "git_branches",
  "git_stage",
  "git_unstage",
  "git_commit",
  "git_checkout_branch",
  "git_create_branch",
  "git_worktrees",
  "git_create_worktree",
  "git_remove_worktree",
  "list_projects",
  "upsert_project",
  "list_sessions",
  "create_session",
  "update_session",
  "delete_session",
  "get_usage_statistics",
  "get_environment_capabilities",
  "get_file_opener_availability",
  "set_menu_bar_visibility",
  "set_system_sleep_prevention",
  "workspace_tree",
  "pick_workspace_directory",
  "read_workspace_binary_file",
  "read_workspace_file",
  "write_workspace_file",
  "create_terminal_session",
  "write_terminal_input",
  "close_terminal_session",
  "read_melody_config",
  "update_melody_config",
  "list_melody_extensions",
  "list_melody_skills",
  "set_melody_extension_enabled",
  "list_marketplace_sources",
  "add_marketplace_source",
  "save_marketplace_source",
  "delete_marketplace_source",
  "install_melody_plugin",
  "scan_marketplace_plugins",
  "update_melody_plugin",
  "list_installed_melody_plugins",
  "get_melody_plugin_details",
  "get_melody_skill_details",
  "uninstall_melody_plugin",
  "delete_melody_skill",
  "list_permission_rules",
  "find_permission_rule",
  "upsert_permission_rule",
  "delete_permission_rule",
  "fetch_research_resource",
  "check_app_update",
]
